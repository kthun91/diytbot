services:
  ytbot:
    build: .
    image: ytbot:local
    container_name: ytbot
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
